name: Canli macOS 26 Masaustu (Pinggy)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Mac Masaustu Sifresi'
        required: true
        default: '123456'
        type: string

jobs:
  macos-gui:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: macOS 26 Masaustu ve Web Tunelini Baslat
        run: |
          # 1. Mac VNC Ekran Paylasimini Ac
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${{ github.event.inputs.vnc_password }}" \
            -restart -agent -privs -all

          # 2. Tarayici arayuzunu (noVNC) kur
          brew install websockify
          git clone --depth 1 https://github.com /tmp/novnc
          websockify --web /tmp/novnc 6080 localhost:5900 &
          sleep 3

          # 3. Pinggy ile aninda tarayici linki uret ve ekrana yazdir
          echo "=========================================================="
          echo "ASAGIDAKI .pinggy.link ADRESINE TIKLAYIP MASAUSTUNE BAGLANIN:"
          echo "=========================================================="
          ssh -o StrictHostKeyChecking=no -R 80:localhost:6080 a.pinggy.io
