name: Canli macOS 26 Masaustu (VNC)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Mac Masaustu Sifreniz (En az 6 karakter)'
        required: true
        default: '123456'
        type: string

jobs:
  macos-gui:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: VNC Ekran Paylasimini ve Tuneli Baslat
        run: |
          # VNC sifresini ve ekran paylasimini aktif et
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${{ github.event.inputs.vnc_password }}" \
            -restart -agent -privs -all

          # Ucretsiz tunel aracini (cloudflared) kur ve VNC portunu (5900) disari ac
          brew install cloudflared
          echo "=========================================="
          echo "MACOS 26 CANLI MASAUSTU HAZIRLANIYOR..."
          echo "Asagidaki trycloudflare.com adresini kopyalayip VNC Viewer'a yapistirin!"
          echo "=========================================="
          cloudflared tunnel --url tcp://localhost:5900
