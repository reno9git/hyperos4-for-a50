name: Canli macOS 26 Masaustu (Tarayici)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Mac Masaustu Sifresi'
        required: true
        default: '123456'
        type: string

jobs:
  macos-gui:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Tarayici Tabanli macOS 26 Masaustunu Baslat
        run: |
          # 1. Mac VNC Ekran Paylasimini Ac
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${{ github.event.inputs.vnc_password }}" \
            -restart -agent -privs -all

          # 2. Tarayicidan erisim icin noVNC ve Cloudflared kur
          brew install cloudflared python3
          git clone --depth 1 https://github.com /tmp/novnc
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3

          # 3. Tuneli baslat ve linki ekrana zorla yazdir
          cloudflared tunnel --url http://localhost:6080 > /tmp/tunnel.log 2>&1 &
          sleep 8
          echo "========================================================"
          echo "MACOS 26 MASAUSTU LINKINIZ (TARAYICIDA ACIN):"
          grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1
          echo "========================================================"
          tail -f /tmp/tunnel.log
